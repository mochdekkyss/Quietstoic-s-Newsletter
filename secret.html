<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Code</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(160deg, #0a1f44, #000000);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.card {
    width: 90%;
    max-width: 350px;
    background: rgba(255,255,255,0.95);
    padding: 30px 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    transition: 0.3s ease;
}

h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #0a1f44;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #ddd;
    margin-bottom: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    background: #0a1f44;
    color: white;
    cursor: pointer;
}

.error {
    font-size: 14px;
    color: red;
    margin-top: 10px;
    height: 18px;
}

/* Floating Welcome */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

/* Loading bar */
.loading-container {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
    margin-top: 20px;
    overflow: hidden;
}

.loading-bar {
    height: 100%;
    width: 0%;
    background: white;
    border-radius: 10px;
    animation: load 4s linear forwards;
}

@keyframes load {
    from { width: 0%; }
    to { width: 100%; }
}

/* Foto */
.profile-img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.success {
    background: transparent;
    box-shadow: none;
    color: white;
}
</style>
</head>

<body>

<div class="card" id="card">
    <h2>Enter the secret code</h2>
    <input type="password" id="password" placeholder="input password..." autofocus>
    <button onclick="checkPassword()">Enter</button>
    <div class="error" id="error"></div>
</div>

<script>
const input = document.getElementById("password");
const card = document.getElementById("card");
const error = document.getElementById("error");

function checkPassword() {
    if(input.value === "dekky.ss") {

        card.classList.add("success");
        card.innerHTML = `
            <img src="https://i.imgur.com/Bm8PXDH.png" class="profile-img">
            <h1 style="animation: float 2s ease-in-out infinite;">
                Welcome Everyone
            </h1>
            <h1 style="animation: float 2s ease-in-out infinite;">
                Wait ya...
            </h1>
            <div class="loading-container">
                <div class="loading-bar"></div>
            </div>
        `;

        setTimeout(function() {
            window.location.href = "https://mochdekkyss.github.io/dekky-blog/";
        }, 4000);

    } else {
        error.innerText = "Wrong secret code!";
    }
}

input.addEventListener("keyup", function(event) {
    if(event.key === "Enter") {
        checkPassword();
    }
});
</script>

</body>
</html>
