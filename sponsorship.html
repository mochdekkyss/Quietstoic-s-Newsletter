<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Sponsorship | Quietstoic</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    color:#fff;
    text-align:center;
    padding:40px 20px;

    background-image:url('https://mochdekkyss.github.io/Quietstoic-s-Newsletter/bg.jpg');
    background-position:center;
    background-repeat:no-repeat;
    background-size:cover;
    background-attachment:fixed;

    min-height:100vh;
    display:flex;
    flex-direction:column;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(30,50,80,.6);
    z-index:-1;
}

h1{
    font-size:28px;
    margin-bottom:10px;
    text-shadow:2px 2px 5px rgba(0,0,0,.5);
}

.subtitle{
    max-width:340px;
    margin:0 auto 30px;
    line-height:1.7;
    font-size:15px;
    opacity:.9;
}

.qris-box{
    width:100%;
    max-width:340px;
    margin:0 auto;
    background:rgba(255,255,255,.12);
    border:3px solid #d4af37;
    border-radius:20px;
    padding:15px;
    backdrop-filter:blur(6px);
}

.qris-box img{
    width:100%;
    border-radius:14px;
    display:block;
}

.btn{
    display:block;
    width:90%;
    max-width:300px;
    margin:20px auto 0;
    padding:15px;
    border-radius:20px;
    font-size:18px;
    font-weight:600;
    text-decoration:none;
    transition:.3s;
}

.btn-outline{
    border:3px solid #d4af37;
    color:#fff;
    backdrop-filter:blur(6px);
}

.btn-outline:hover{
    background:#d4af37;
    color:#2f4a6d;
}

.footer{
    margin-top:auto;
    text-align:center;
    padding:20px 0;
    font-size:13px;
    opacity:.7;
}

.footer .line{
    width:60%;
    height:2px;
    margin:0 auto 10px;
    background:#d4af37;
    border-radius:10px;
}
</style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7FPPG1KVES"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

gtag('config', 'G-7FPPG1KVES');
</script>

</head>
<body>

<h1>Sponsorship</h1>

<p class="subtitle">
Thank you for supporting Quietstoic's Newsletter.<br>
Every contribution means a lot and helps this project continue to grow. ❤️
</p>

<div class="qris-box">
    <img src="https://cdn.phototourl.com/free/2026-08-15-6154daa9-91b9-49a7-b717-0b7a4d1169cb.jpg" alt="QRIS for All">
</div>

<a href="index.html" class="btn btn-outline">← Back to Home</a>

<footer class="footer">
    <div class="line"></div>
    © copyright - dekky.ss
</footer>

</body>
</html>
